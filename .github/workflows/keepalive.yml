# Keeps the free Render instance awake: a visit every 10 minutes stops it from spinning down after 15 idle minutes.
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://pocketmonstars.onrender.com/healthz || true
