<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PocketMonstars • Covo 3D Motion Lab</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080f1d;color:white;font:14px system-ui}canvas{display:block;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}#title{position:absolute;top:12px;left:15px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 8px #000}#title small{display:block;color:#a6d7ff;font-weight:500;letter-spacing:0}.hp{position:absolute;top:16px;right:16px;width:160px;background:#1d2638;border:1px solid #8db3dc;border-radius:8px;height:15px;overflow:hidden}.hp b{display:block;background:linear-gradient(90deg,#11a75b,#90f8a6);height:100%;width:100%}#tip{position:absolute;top:50px;left:15px;color:#b5d5ef;font-size:12px;max-width:230px}#pad{position:absolute;bottom:26px;left:24px;width:130px;height:130px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff12;pointer-events:auto;touch-action:none}#knob{position:absolute;width:54px;height:54px;border-radius:50%;background:#86b9f5a0;border:2px solid #b5dcff;left:36px;top:36px}#actions{position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(2,68px);gap:10px;pointer-events:auto}button{border:1px solid #94c6ff;color:white;background:#1b4878db;border-radius:50%;height:68px;font-weight:800;touch-action:manipulation}button:nth-child(2){background:#6d3e9fdb}button:nth-child(3){background:#1e7b8fdb}button:nth-child(4){background:#9b6a21db}#note{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);font-size:10px;color:#b2c6df;white-space:nowrap}@media(orientation:portrait){#tip{top:76px}#pad{bottom:48px;width:110px;height:110px}#knob{left:27px;top:27px}#actions{bottom:45px;grid-template-columns:repeat(2,57px)}button{height:57px;font-size:11px}}</style></head><body><div id="hud"><div id="title">POCKETMONSTARS <small>COVO • 3D motion laboratory</small></div><div class="hp"><b></b></div><div id="tip">Drag joystick to move • tap powers to cast • rotate with movement</div><div id="pad"><div id="knob"></div></div><div id="actions"><button id="cast">PALM</button><button id="kick">WAVE</button><button id="dash">DASH</button><button id="form">EVOLVE</button></div><div id="note">Prototype model • original arena movement • ranged energy only</div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#0a1427');scene.fog=new THREE.Fog('#0a1427',36,85);const camera=new THREE.PerspectiveCamera(49,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcdeeff,0x344260,2));const sun=new THREE.DirectionalLight(0xffedca,2.7);sun.position.set(-8,16,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,emissive=0)=>new THREE.MeshStandardMaterial({color,roughness:.55,metalness:.1,emissive,emissiveIntensity:emissive?.55:0});const skin=mat('#9b613e'),hair=mat('#edbd48'),suit=mat('#2569b7'),white=mat('#e8f0f7'),gold=mat('#e6ae32'),boot=mat('#16395c'),eye=mat('#f9fcff',0x6688ff);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),mat('#182d40'));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(80,40,0x345873,0x29415b);grid.position.y=.015;scene.add(grid);const ringGeo=new THREE.RingGeometry(.98,1.025,80);const range=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:0x49d4ff,transparent:true,opacity:.65,side:THREE.DoubleSide}));range.rotation.x=-Math.PI/2;range.position.y=.05;scene.add(range);
for(let i=0;i<24;i++){const x=Math.sin(i*2.4)*29,z=Math.cos(i*2.4)*29;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(1.1+(i%3)*.5,0),mat(i%2?'#35566c':'#2e465e'));rock.position.set(x,.6,z);rock.castShadow=true;scene.add(rock)}
const actor=new THREE.Group();scene.add(actor);const body=new THREE.Group();actor.add(body);function mesh(parent,geo,material,x=0,y=0,z=0){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}function capsule(parent,r,len,material,x,y,z){return mesh(parent,new THREE.CapsuleGeometry(r,len,6,10),material,x,y,z)}
const hips=mesh(body,new THREE.SphereGeometry(.33,16,12),suit,0,1.18,0);const torso=capsule(body,.36,.72,suit,0,1.8,0);mesh(body,new THREE.BoxGeometry(.57,.13,.1),gold,0,1.42,.33);const neck=capsule(body,.13,.12,skin,0,2.35,0);const head=new THREE.Group();head.position.y=2.6;body.add(head);mesh(head,new THREE.SphereGeometry(.34,20,16),skin);mesh(head,new THREE.SphereGeometry(.095,12,12),eye,-.135,.035,.3);mesh(head,new THREE.SphereGeometry(.095,12,12),eye,.135,.035,.3);mesh(head,new THREE.SphereGeometry(.04,10,10),boot,-.135,.035,.385);mesh(head,new THREE.SphereGeometry(.04,10,10),boot,.135,.035,.385);for(let i=0;i<9;i++){const a=i*Math.PI*2/9;const tuft=mesh(head,new THREE.ConeGeometry(.115,.48,6),hair,Math.cos(a)*.23,.34,Math.sin(a)*.23);tuft.rotation.z=-Math.cos(a)*.35;tuft.rotation.x=Math.sin(a)*.35}
const glowBlue=new THREE.MeshBasicMaterial({color:0x45caff,emissive:0x218bff,emissiveIntensity:2});
const sigil=mesh(head,new THREE.TorusGeometry(.105,.021,8,32),glowBlue,0,.17,.323);sigil.rotation.z=.28;
mesh(body,new THREE.TorusGeometry(.17,.025,8,32),glowBlue,0,1.92,.36);
const braids=[];for(let i=0;i<12;i++){const a=i*Math.PI*2/12;const root=new THREE.Group();root.position.set(Math.cos(a)*.27,.2,Math.sin(a)*.26);head.add(root);for(let j=0;j<5;j++){const bead=mesh(root,new THREE.SphereGeometry(.045+(j%2)*.01,8,6),j===2?gold:hair,Math.sin(j*.6+a)*.035,-j*.12,0);bead.scale.set(1,.85,1)}braids.push(root)}
const sash=[];for(let i=0;i<3;i++){const cloth=mesh(body,new THREE.BoxGeometry(.18,.72,.055),i===1?white:suit,(i-1)*.2,.97,.25);cloth.rotation.z=(i-1)*.24;sash.push(cloth)}
const limbs={};function arm(side){const shoulder=new THREE.Group();shoulder.position.set(side*.43,2.16,0);body.add(shoulder);capsule(shoulder,.14,.36,suit,side*.035,-.27,0);const elbow=new THREE.Group();elbow.position.set(side*.04,-.55,0);shoulder.add(elbow);capsule(elbow,.115,.32,skin,0,-.25,0);const hand=mesh(elbow,new THREE.SphereGeometry(.15,12,10),skin,0,-.5,0);mesh(elbow,new THREE.CylinderGeometry(.14,.14,.14,12),gold,0,-.39,0);limbs[side<0?'leftArm':'rightArm']={shoulder,elbow,hand};}function leg(side){const hip=new THREE.Group();hip.position.set(side*.22,1.08,0);body.add(hip);capsule(hip,.18,.35,suit,0,-.28,0);const knee=new THREE.Group();knee.position.y=-.55;hip.add(knee);capsule(knee,.15,.35,boot,0,-.27,0);const foot=mesh(knee,new THREE.BoxGeometry(.31,.2,.48),boot,0,-.57,.12);mesh(knee,new THREE.BoxGeometry(.32,.08,.49),gold,0,-.52,.12);limbs[side<0?'leftLeg':'rightLeg']={hip,knee,foot}}arm(-1);arm(1);leg(-1);leg(1);
const aura=new THREE.Mesh(new THREE.TorusGeometry(.82,.055,8,64),new THREE.MeshBasicMaterial({color:0x6bd9ff,transparent:true,opacity:.7}));aura.rotation.x=Math.PI/2;aura.position.y=.15;actor.add(aura);let evolved=false,castTime=0,castKind='palm',t=0,heading=0,move={x:0,y:0};const projectiles=[];const impactRings=[];const projMat=new THREE.MeshBasicMaterial({color:0x69eaff});function cast(kind){castKind=kind;castTime=.5;const dir=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));const origin=actor.position.clone().add(new THREE.Vector3(0,kind==='kick'?.75:1.85,0)).addScaledVector(dir,.7);const ball=new THREE.Mesh(new THREE.SphereGeometry(kind==='kick'?.34:.23,16,12),projMat.clone());ball.material.color.set(kind==='kick'?0xf9bd64:evolved?0xffdf66:0x6de9ff);ball.position.copy(origin);scene.add(ball);const halo=new THREE.Mesh(new THREE.TorusGeometry(kind==='kick'?.52:.36,.045,8,32),new THREE.MeshBasicMaterial({color:kind==='kick'?0xffc56c:0x66eaff,transparent:true,opacity:.85}));halo.position.copy(origin);halo.rotation.y=heading;scene.add(halo);projectiles.push({mesh:ball,halo,dir,life:1.6,kind});}document.getElementById('cast').onclick=()=>cast('palm');document.getElementById('kick').onclick=()=>cast('kick');document.getElementById('dash').onclick=()=>{actor.position.x+=Math.sin(heading)*2.4;actor.position.z+=Math.cos(heading)*2.4};document.getElementById('form').onclick=()=>{evolved=!evolved;hair.color.set(evolved?'#f6f7ff':'#edbd48');aura.material.color.set(evolved?0xffca53:0x6bd9ff)};
const pad=document.getElementById('pad'),knob=document.getElementById('knob');function padMove(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.clientX-cx)/(r.width*.37),y=(e.clientY-cy)/(r.height*.37);const d=Math.max(1,Math.hypot(x,y));move={x:x/d,y:y/d};knob.style.transform=`translate(${move.x*r.width*.27}px,${move.y*r.height*.27}px)`}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))padMove(e)});function stop(){move={x:0,y:0};knob.style.transform=''}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.repeat)return;if(e.key===' ')cast('palm');if(e.key.toLowerCase()==='e')cast('kick');if(e.key.toLowerCase()==='q')document.getElementById('form').click()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
let prev=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-prev)/1000,.05);prev=now;t+=dt;let dx=move.x+(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=move.y+(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);const mag=Math.min(1,Math.hypot(dx,dy));if(mag){dx/=Math.hypot(dx,dy);dy/=Math.hypot(dx,dy);heading=Math.atan2(dx,-dy);actor.rotation.y=heading;actor.position.x=THREE.MathUtils.clamp(actor.position.x+dx*dt*6,-35,35);actor.position.z=THREE.MathUtils.clamp(actor.position.z+dy*dt*6,-35,35)}const stride=Math.sin(t*12)*mag;body.position.y=Math.abs(stride)*.08+Math.sin(t*3)*.035;body.rotation.z=-stride*.06;body.rotation.x=castTime>0?-.15:0;head.rotation.z=Math.sin(t*2)*.025;braids.forEach((b,i)=>{b.rotation.z=Math.sin(t*5+i)*(.08+mag*.12)});sash.forEach((c,i)=>{c.rotation.x=Math.sin(t*7+i)*(.07+mag*.16)});limbs.leftLeg.hip.rotation.x=stride*.55;limbs.rightLeg.hip.rotation.x=-stride*.55;limbs.leftLeg.knee.rotation.x=Math.max(0,-stride)*.45;limbs.rightLeg.knee.rotation.x=Math.max(0,stride)*.45;limbs.leftArm.shoulder.rotation.x=-stride*.35;limbs.rightArm.shoulder.rotation.x=stride*.35;limbs.leftArm.shoulder.rotation.z=.15;limbs.rightArm.shoulder.rotation.z=-.15;if(castTime>0){castTime-=dt;const p=1-Math.max(0,castTime)/.5;limbs.rightArm.shoulder.rotation.x=-1.8*Math.sin(Math.PI*Math.min(1,p));limbs.leftArm.shoulder.rotation.x=castKind==='palm'?-1.5*Math.sin(Math.PI*Math.min(1,p)):-.3;limbs.rightArm.elbow.rotation.x=-.45;limbs.rightLeg.hip.rotation.x=castKind==='kick'?-1.1*Math.sin(Math.PI*p):limbs.rightLeg.hip.rotation.x}else limbs.rightArm.elbow.rotation.x=0;aura.scale.setScalar(evolved?1.2+.16*Math.sin(t*8):1+.07*Math.sin(t*4));range.position.set(actor.position.x,.06,actor.position.z);for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.life-=dt;p.mesh.position.addScaledVector(p.dir,dt*15);p.halo.position.copy(p.mesh.position);p.halo.rotation.z+=dt*7;p.mesh.scale.setScalar(1+.2*Math.sin(t*25));if(p.life<=0){scene.remove(p.mesh,p.halo);p.mesh.geometry.dispose();p.mesh.material.dispose();p.halo.geometry.dispose();p.halo.material.dispose();const ring=new THREE.Mesh(new THREE.RingGeometry(.2,.28,40),new THREE.MeshBasicMaterial({color:p.kind==='kick'?0xffbc65:0x58d9ff,transparent:true,opacity:.85,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(p.mesh.position.x,.08,p.mesh.position.z);scene.add(ring);impactRings.push({mesh:ring,life:.45});projectiles.splice(i,1)}}for(let i=impactRings.length-1;i>=0;i--){const r=impactRings[i];r.life-=dt;r.mesh.scale.setScalar(1+(1-r.life/.45)*6);r.mesh.material.opacity=Math.max(0,r.life/.45)*.85;if(r.life<=0){scene.remove(r.mesh);r.mesh.geometry.dispose();r.mesh.material.dispose();impactRings.splice(i,1)}}const desired=new THREE.Vector3(actor.position.x,15,actor.position.z+18);camera.position.lerp(desired,Math.min(1,dt*3));camera.lookAt(actor.position.x,0,actor.position.z);renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
